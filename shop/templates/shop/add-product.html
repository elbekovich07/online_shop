{% extends 'shop/base/base.html' %}

{% block product_create_content %}
    <style>
        body {
            background: #f8f9fa;
            padding: 20px;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            margin: auto;
            background: #ffffff;
        }

        .card-header {
            background: #212529;
            color: #ffffff;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
        }

        button {
            background: #212529;
            color: #ffffff;
            border: none;
        }

        button:hover {
            background: #343a40;
        }

        a.btn-secondary {
            background: #212529;
            color: #ffffff;
        }

        a.btn-secondary:hover {
            background: #343a40;
        }
    </style>
    <div class="card">
        <div class="card-header">
            Product add
        </div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="text-center mt-4">
                    <button type="submit" class="btn">Done</button>
                    <a href="{% url 'index' %}" class="btn btn-secondary ms-2">Return to Home Page</a>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
